[project]
name = "eegdash-tagger"
version = "0.1.0"
description = "Automatic tagging of EEG datasets using LLM-based predictions"
authors = [{ name = "Kuntal Kokate" }]
requires-python = ">=3.11.5"
dependencies = [
    "pandas>=2.0",
    "requests>=2.33.0",
    "beautifulsoup4",
    "python-dotenv>=1.2.2",
    # Security floors for transitive deps: pip (eegdash-llm-api's prod image)
    # ignores uv.lock, so the floors that must hold live here.
    "urllib3>=2.8.0",
    "idna>=3.15",
    "certifi>=2026.10.18",
    "soupsieve>=4.0.0",
]

[project.scripts]
eegdash-fetch-incomplete = "scripts.fetch_incomplete_datasets:main"
eegdash-fetch-complete = "scripts.fetch_complete_datasets:main"
eegdash-update-csv = "scripts.update_csv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eegdash_tagger"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
