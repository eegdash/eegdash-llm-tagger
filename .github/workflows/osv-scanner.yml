# Fails the build when a locked dependency has a known OSV advisory.
name: osv-scanner
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=uv.lock
